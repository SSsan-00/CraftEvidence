name: Release candidate

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: Runtime identifier
        required: true
        default: win-x64
        type: choice
        options:
          - win-x64
          - win-x86

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build review artifact
        shell: pwsh
        run: ./bootstrap.ps1 -Publish -Runtime '${{ inputs.runtime }}'

      - uses: actions/upload-artifact@v4
        with:
          name: CraftEvidence-${{ inputs.runtime }}
          path: artifacts/publish/${{ inputs.runtime }}/
          if-no-files-found: error
